<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Milna Chennath | Contact</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f3f1;
      color: #171717;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 28px;
      padding: 42px 30px 30px;
      text-align: center;
      box-shadow: 0 18px 55px rgba(0,0,0,.10);
    }
    .initials {
      width: 78px;
      height: 78px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171717;
      color: #fff;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -.03em;
    }
    .role {
      margin: 9px 0 3px;
      font-size: 16px;
      font-weight: 600;
    }
    .org {
      margin: 0 0 30px;
      color: #666;
      font-size: 15px;
    }
    .button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      background: #171717;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .link {
      display: block;
      padding: 11px;
      color: #333;
      text-decoration: none;
      font-size: 15px;
    }
    .footer {
      margin-top: 25px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="initials">MC</div>
    <h1>Milna Chennath</h1>
    <p class="role">PhD Candidate</p>
    <p class="org">The University of Sydney</p>

    <a class="button" href="Milna_Chennath.vcf">＋ Add to Contacts</a>
    <a class="link" href="tel:+61479133398">Call 0479 133 398</a>
    <a class="link" href="mailto:milna.chennath@sydney.edu.au">milna.chennath@sydney.edu.au</a>

    <div class="footer">Tap the button above to save my contact details.</div>
  </main>

</html>
